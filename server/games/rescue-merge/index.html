<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <meta name="theme-color" content="#0b1120" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Rescue Merge — Shelter Drop &amp; Merge</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Phaser 3 (includes Matter.js 2D Physics Engine) -->
   <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js" integrity="sha384-Fi7F0CYQBHYa+s2vvYJeiqvOQf3tuZ28vafRGXvMt7ijxNTVf3+eXPkNRIUi9JD2" crossorigin="anonymous"></script>
</head>
<body>
  <main class="app-shell">
    <header class="top-bar">
      <div class="brand-title">
        <h1>RESCUE MERGE</h1>
        <span class="brand-pill">6 Tiers</span>
      </div>
      <div class="bar-actions">
        <button id="mute-btn" class="control-btn" type="button" aria-pressed="false">
          Sound: on
        </button>
        <button
          id="restart-btn"
          class="control-btn"
          type="button"
          disabled
        >
          Restart
        </button>
      </div>
    </header>

    <!-- Phaser 3 + Matter.js Portrait Canvas Container (450x800 native with FIT + CENTER_BOTH) -->
    <div id="game-container" class="canvas-stage" aria-label="Rescue Merge Playpen"></div>
    <p class="game-note">Aim, then release to drop. Match two of a kind. Keep below the line.</p>
    <p id="photo-notice" class="game-note" role="status" hidden></p>
  </main>

  <script src="./app.js"></script>
</body>
</html>
